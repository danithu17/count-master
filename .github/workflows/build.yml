name: Build Count Master UI
on: [push]

jobs:
  build:
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v4

    - name: Setup vcpkg
      run: |
        git clone https://github.com/microsoft/vcpkg.git
        cd vcpkg
        ./bootstrap-vcpkg.sh
        ./vcpkg install sfml:x64-windows

    - name: Compile Game
      run: |
        g++ -c main.cpp -I"vcpkg/packages/sfml_x64-windows/include"
        g++ main.o -o CountMaster.exe -L"vcpkg/packages/sfml_x64-windows/lib" -lsfml-graphics -lsfml-window -lsfml-system

    - name: Upload Game Bundle
      uses: actions/upload-artifact@v4
      with:
        name: CountMaster-Windows
        path: |
          CountMaster.exe
          vcpkg/packages/sfml_x64-windows/bin/*.dll